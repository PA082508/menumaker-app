<!DOCTYPE html>
<!--
  DCY_01234_v6_original.html — LOCAL, same-origin, READ-ONLY 1:1 replica of the storefront
  DCY 01234 (v6) fillable kit, for the in-app "View original form" (Step 1).

  It is the SAME official-form OVERLAY as the storefront: the official ODCY page scans are the
  background (DCY01234_2026_page-1/2.png), and the submitted values are placed at the SAME
  FIELDS[] coordinates as the live kit — so the reviewer sees the recognizable government form,
  1:1, with the parent signature in its real place. NO redesign, NO form-kit engine, NO inputs
  (everything is read-only). Interactivity (submit/clear/gate/prefill/masks) is stripped.

  Contract (same as CACFP report iframe):
    parent → iframe:  postMessage({ type:'original-render', formData:{...}, signatures:{...} }, '*')
    standalone:       ?data=<uri JSON {formData, signatures}>
  Chrome (stamp / print) lives OUTSIDE the sheet; @media print emits ONLY the pages.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCY 01234 v6 — filed original</title>
<style>
  /* ---- overlay geometry copied verbatim from the storefront kit (v6) ---- */
  :root{ --line:#0066cc; }
  *{box-sizing:border-box}
  body{margin:0;background:#5a6b60;font-family:Arial,Helvetica,sans-serif}
  .doc{padding:14px 0 60px}
  .page{position:relative;width:1275px;height:1650px;margin:0 auto 20px;background:#fff no-repeat;
    background-size:1275px 1650px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .page.p1{background-image:url("DCY01234_2026_page-1.png")}
  .page.p2{background-image:url("DCY01234_2026_page-2.png")}
  /* read-only value cell — same footprint as the kit's .f input, no edit affordance */
  .rv{position:absolute;font-family:Arial,sans-serif;font-size:15px;color:#111;
    background:rgba(255,253,150,0.45);padding:1px 4px;overflow:hidden;white-space:nowrap;
    display:flex;align-items:center;line-height:1.1}
  .rv.area{white-space:pre-wrap;align-items:flex-start;line-height:1.35;padding:3px 5px;background:rgba(255,253,150,0.35)}
  .rmark{position:absolute;width:18px;height:18px;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:800;color:#0f4c35}
  .rsig{position:absolute;object-fit:contain;background:transparent}
  /* stamp — OUTSIDE the sheet, a corner badge (Print/Close come from the in-app viewer header);
     screen-only so print emits ONLY the official pages. */
  .stamp{position:fixed;top:10px;right:12px;z-index:50;font-family:Inter,Arial,sans-serif;
    font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#0f4c35;
    background:#fff;border:1.5px solid #0f4c35;border-radius:6px;padding:4px 9px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  @media print{
    body{background:#fff}
    .stamp{display:none!important}
    .doc{padding:0}
    .page{box-shadow:none;margin:0}
    .rv,.rv.area{background:transparent}
    @page{size:8.5in 11in;margin:0}
  }
</style>
</head>
<body>
  <div class="stamp">Copy — what was signed</div>

  <div class="doc" id="doc">
    <div class="page p1" id="page1"></div>
    <div class="page p2" id="page2"></div>
  </div>

function txt(v){ return (v===undefined||v===null)?'':String(v); }

function render(formData, signatures){
  var fd = formData||{}, sg = signatures||{};
  var pg = {1:document.getElementById('page1'), 2:document.getElementById('page2')};
  pg[1].innerHTML=''; pg[2].innerHTML='';

  document.querySelectorAll('[data-meta="center"]').forEach(function(el){ el.textContent = txt(fd.center_code)||'—'; });

  FIELDS.forEach(function(f){
    var host = pg[f.p]; if(!host) return;
    if(f.t==='cb'){
      if(txt(fd[f.id]).trim()!==''){        // checked only when the value is present
        var m=document.createElement('div'); m.className='rmark';
        m.style.left=f.x+'px'; m.style.top=f.y+'px'; m.textContent='✓';
        host.appendChild(m);
      }
    } else if(f.t==='sig'){
      var src = sg[f.id];
      if(src && String(src).indexOf('data:image')===0){
        var img=document.createElement('img'); img.className='rsig';
        img.style.cssText='left:'+f.x+'px;top:'+f.y+'px;width:'+f.w+'px;height:'+f.h+'px';
        img.src=src; host.appendChild(img);
      }
    } else {
      var v = txt(fd[f.id]); if(v.trim()==='') return;
      var d=document.createElement('div'); d.className = 'rv' + (f.t==='area'?' area':'');
      d.style.cssText='left:'+f.x+'px;top:'+f.y+'px;width:'+f.w+'px;height:'+f.h+'px';
      d.textContent=v; host.appendChild(d);
    }
  });
}
window.renderOriginal = render;

// fit-to-width on screen (real 1275px form scaled down); actual size for print.
function fit(){
  var s = Math.min(1, (document.documentElement.clientWidth - 8) / 1275);
  document.getElementById('doc').style.zoom = s;
}
window.addEventListener('resize', fit);
window.addEventListener('beforeprint', function(){ document.getElementById('doc').style.zoom = 1; });
window.addEventListener('afterprint', fit);

// React iframe channel
window.addEventListener('message', function(e){
  var d=e.data; if(d && d.type==='original-render'){ render(d.formData, d.signatures); fit(); }
});
// Standalone preview
(function(){
  try{
    var q=new URLSearchParams(location.search).get('data');
    if(q){ var p=JSON.parse(q); render(p.formData||p, p.signatures||{}); }
    else render({},{});
  }catch(err){ render({},{}); }
  fit();
})();
